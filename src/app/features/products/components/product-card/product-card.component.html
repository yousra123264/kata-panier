<div class="card">
  <h3>{{ product.productName }}</h3>
  <div class="category">{{ product.category }}</div>

  <div>
    <span class="price-label">Prix HT :</span>
    {{ product.price | currency: 'EUR' }} <br />
    <span class="price-label">Prix TTC :</span> {{ product | prixTtc | currency:'EUR' }}
  </div>

  @if (!isOutOfStock()) {
    <div class="quantity">
      <label for="qty">Quantité :</label>
      <input
        type="number"
        id="qty"
        [(ngModel)]="quantity"
         min="1"
        [max]="product.quantity"
      />
    </div>

    <button class="add-button" (click)="addToCart()">Ajouter</button>
  } @else {
    <div class="not-available">Non disponible</div>
  }
</div>
